# Deploys the site to GitHub Pages on every push to main.
#
# The build itself lives in scripts/build.sh (shared with Vercel): only the
# files the site needs are published (index.html, manifest, service worker,
# css/, js/, assets/) — docs, tools, the news backend and git metadata stay
# out. Secrets are injected into the staged copy, never into the files
# committed to the repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # Deploying with Vercel instead? Add a repository variable
    # PAGES_DEPLOY = off (Settings → Secrets and variables → Actions →
    # Variables) and this workflow skips itself instead of failing.
    if: ${{ vars.PAGES_DEPLOY != 'off' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same build Vercel runs: stage the site files, fill keys from the
      # secrets below (all optional), and version the service-worker cache.
      - name: Build site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          METERED_TURN_DOMAIN: ${{ secrets.METERED_TURN_DOMAIN }}
          METERED_TURN_API_KEY: ${{ secrets.METERED_TURN_API_KEY }}
        run: bash scripts/build.sh

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
